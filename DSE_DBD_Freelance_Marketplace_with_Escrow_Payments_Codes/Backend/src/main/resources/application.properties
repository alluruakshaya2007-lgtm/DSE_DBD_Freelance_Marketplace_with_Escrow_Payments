# ===============================
# Default app configuration
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# ===============================
# Shared JPA / Server settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:freelance_marketplace}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bhaa1403thi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:change-me-please-very-long-and-freelsecure-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
