services:
  mysql:
    image: mysql:8.4
    container_name: freelancehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: freelance_marketplace
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-boot:
    build: ./Backend/freelance-marketplace
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/freelance_marketplace?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-password}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-for-local-development}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: ./API
    environment:
      SPRING_BOOT_URL: http://spring-boot:8080
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      spring-boot:
        condition: service_healthy

volumes:
  mysql_data:
